<title>課程首頁</title>
<style>
:root{
  --bg:#f4f2ee; --bg2:#efece7; --card:#ffffff; --cell:#fcfbf9;
  --ink:#4a4844; --ink-soft:#807c74; --ink-faint:#a8a49b; --dark:#3f3d39;
  --line:#e7e3db; --line-strong:#d8d3c8;
  --accent:#8a9a86; --accent-deep:#6f7f6b; --accent-soft:#e4eae0;
  --danger:#c99b93; --danger-ink:#a8635a; --danger-soft:#f8e9e5;
  --warm-ink:#9c7a56; --warm-soft:#f3ece3;
  --radius:16px; --radius-s:11px;
  --shadow:0 1px 2px rgba(80,74,64,.04),0 6px 20px rgba(80,74,64,.06);
  --shadow-soft:0 1px 3px rgba(80,74,64,.05);
  --glass:rgba(246,244,240,.82);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mix-base:#ffffff; --mix-ink:#3f3d39;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#23211e; --bg2:#2b2925; --card:#2f2c28; --cell:#2a2824;
  --ink:#e8e3da; --ink-soft:#b4aea3; --ink-faint:#8a857c; --dark:#f1ece4;
  --line:#3b3833; --line-strong:#4a463f;
  --accent:#9aab96; --accent-deep:#b7c7b2; --accent-soft:#353d33;
  --danger:#d6a69e; --danger-ink:#e5a49a; --danger-soft:#43302c;
  --warm-ink:#d8b48a; --warm-soft:#40362a;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.25); --shadow-soft:0 1px 3px rgba(0,0,0,.2);
  --glass:rgba(35,33,30,.82); --mix-base:#2f2c28; --mix-ink:#ffffff;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg2)}
body{background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 700px) no-repeat,var(--bg2);min-height:100vh;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(60px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-weight:700;letter-spacing:.2px;margin:0}
p{margin:0}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:#d9e2d5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* 每門課的顏色：--cb 是課程色，其餘由它算出 */
.cc{--cf:color-mix(in srgb,var(--cb) 32%,var(--mix-base));--ci:color-mix(in srgb,var(--cb) 50%,var(--mix-ink))}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:12px max(18px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .dot{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#a7b7a2,#8a9a86);box-shadow:var(--shadow-soft);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.brand h1{font-size:18px;line-height:1.3}
.brand small{display:block;color:var(--ink-faint);font-size:12px;font-weight:500;letter-spacing:.3px}
.week{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.week b{color:var(--ink);font-weight:700}
.nav{display:flex;gap:4px}
.nav button{border:none;background:transparent;color:var(--ink-soft);padding:7px 14px;border-radius:99px;font-size:14px;font-weight:600;transition:all .25s ease;display:inline-flex;gap:6px;align-items:center}
.nav button:hover{background:var(--bg2);color:var(--ink)}
.nav button.active{background:var(--accent-soft);color:var(--accent-deep)}
.nav .badge{font-size:11px;font-weight:700;background:var(--danger);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.nav .d{display:none}
.tools{display:flex;gap:4px}
.iconbtn{border:none;background:transparent;color:var(--ink-faint);padding:7px;border-radius:9px;line-height:0;transition:all .18s}
.iconbtn:hover{background:var(--bg2);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:819px){
  .brand{flex:1}
  .week{display:none}
  .nav{order:5;width:100%;background:var(--bg2);border-radius:99px;padding:3px;gap:2px}
  .nav button{flex:1;justify-content:center;padding:7px 8px}
  .nav button.active{background:var(--card);color:var(--accent-deep);box-shadow:var(--shadow-soft)}
}
@media (min-width:820px){ .nav .only-m{display:none} .nav .m{display:none} .nav .d{display:inline} }

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-left)) 0}
.section-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.section-head h2{font-size:19px}
.section-head .spacer{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.cols{display:grid;gap:30px;grid-template-columns:minmax(0,1fr)}
.cols>section{min-width:0}
@media (min-width:820px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);align-items:start}}
@media (max-width:819px){ body[data-view="todo"] #col-news, body[data-view="news"] #col-todo{display:none} body:not([data-view="todo"]) .hero{display:none} }
body[data-view="cal"] .cols, body:not([data-view="cal"]) #view-cal{display:none}
.banner{border-radius:var(--radius-s);padding:10px 16px;font-size:13.5px;margin:0 0 16px;background:var(--warm-soft);color:var(--ink)}
.banner.err{background:var(--danger-soft)}

/* buttons */
.btn{border:none;border-radius:var(--radius-s);padding:10px 18px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;transition:all .22s ease;box-shadow:var(--shadow-soft);text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--accent-deep);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.ghost{background:var(--card);color:var(--ink-soft);border:1px solid var(--line-strong);box-shadow:none}
.btn.ghost:hover{background:var(--bg2);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.danger{background:var(--card);color:var(--danger-ink);border:1px solid var(--danger-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.linkbtn{border:none;background:none;color:var(--ink-soft);font-size:13px;font-weight:600;padding:4px 6px;border-radius:7px}
.linkbtn:hover{background:var(--bg2);color:var(--ink)}

/* ---------- hero ---------- */
.hero{margin:0 0 22px;display:grid;gap:18px}
@media (min-width:820px){.hero{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.next{position:relative;overflow:hidden;padding:22px 22px 20px 26px}
.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--cb)}
.next .lab{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.next h2{font-size:19px;margin:8px 0 2px;line-height:1.4;overflow-wrap:anywhere}
.clock{font-size:clamp(46px,12vw,64px);font-weight:800;line-height:1.05;letter-spacing:1px;font-variant-numeric:tabular-nums;color:var(--dark);margin:14px 0 4px}
.clock .u{font-size:.36em;font-weight:700;color:var(--ink-faint);margin:0 .35em 0 .12em;letter-spacing:0}
.next.hot .clock{color:var(--danger-ink)}
.next .dl{font-size:13.5px;color:var(--ink-soft)}
.next .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.next .over{font-size:12.5px;color:var(--danger-ink);background:var(--danger-soft);border-radius:8px;padding:3px 10px;margin-top:14px;display:inline-block}
.then{padding:18px 18px 10px}
.then h3{font-size:14px;color:var(--ink-soft);margin:0 0 8px}
.then ol{list-style:none;margin:0;padding:0}
.then li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.then li:first-child{border-top:0}
.then .bk{width:28px;height:28px;border-radius:8px;background:var(--cf);flex:none;border:1px solid rgba(0,0,0,.05);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ci)}
.then .mid{min-width:0;flex:1}
.then b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.then small{color:var(--ink-faint);font-size:12px}
@media (max-width:819px){.then{display:none}}

/* chips / tags */
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--card);border-radius:99px;padding:5px 13px 5px 10px;font-size:13px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s}
.chip i{width:11px;height:11px;border-radius:4px;background:var(--cb)}
.chip[aria-pressed="true"]{background:var(--cf,var(--accent-soft));border-color:transparent;color:var(--ci,var(--accent-deep))}
.chip.all[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-deep)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.2px;white-space:nowrap;background:var(--bg2);color:var(--ink-soft)}
.tag.course{background:var(--cf);color:var(--ci)}
.tag.ann{background:#efe8f0;color:#8a6f95}
.tag.evt{background:#e5ecf0;color:#5c7688}
.tag.mine{background:#f0ece3;color:#98805a}
@media (prefers-color-scheme:dark){.tag.ann{background:#3a3340;color:#c9b2d6}.tag.evt{background:#2f3a42;color:#a9c0d2}.tag.mine{background:#3d372c;color:#d6c09a}}

/* ---------- todo ---------- */
.group-label{font-size:13px;font-weight:700;color:var(--ink-soft);margin:18px 0 8px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.group-label::before{content:"";width:5px;height:14px;border-radius:3px;background:var(--accent)}
.group-label.over{color:var(--danger-ink)} .group-label.over::before{background:var(--danger)}
.group-label.tom::before{background:#cfb391} .group-label.week::before{background:#8fa2b0} .group-label.later::before{background:#c8b9a3}
.group-label .n{margin-left:auto;color:var(--ink-faint);font-size:12px}
.cols .group-label:first-child{margin-top:0}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--cell);border:1px solid var(--line);border-radius:var(--radius-s);padding:11px 14px;transition:all .2s ease;position:relative}
.pitem:hover{border-color:var(--line-strong);background:var(--card);box-shadow:var(--shadow-soft)}
.pitem.done{opacity:.55}
.pitem.done .pname{text-decoration:line-through}
.pitem.evt{background:transparent;border-style:dashed}
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);background:var(--card);cursor:pointer;position:relative;transition:all .2s;flex-shrink:0;margin:0}
.chk:hover{border-color:var(--accent)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.pmeta{min-width:0;cursor:pointer;border-radius:8px}
.pmeta:hover .pname{text-decoration:underline;text-underline-offset:3px}
.pnote{font-size:12.5px;color:var(--ink-soft);margin-top:5px;background:var(--bg);border-radius:7px;padding:3px 8px;display:inline-block;white-space:pre-line;overflow-wrap:anywhere}
.tag.u{background:var(--cf);color:var(--ci)}
.moved{font-size:11px;color:var(--warm-ink)}
.pname{font-weight:600;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere;text-decoration:none;display:block}
a.pname:hover{text-decoration:underline;text-underline-offset:3px}
.psub{font-size:12px;color:var(--ink-faint);margin-top:4px;display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.pright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rem{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--bg2);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.rem.warm{background:var(--warm-soft);color:var(--warm-ink)}
.rem.hot,.rem.over{background:var(--danger-soft);color:var(--danger-ink)}
.rem.soon{background:var(--accent-soft);color:var(--accent-deep)}
.empty{text-align:center;padding:34px 20px;color:var(--ink-faint);font-size:13.5px;background:var(--cell);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty .em{font-size:28px;display:block;margin-bottom:8px;opacity:.7}

/* ---------- posts ---------- */
.post{--pt:color-mix(in srgb,var(--cb) 13%,var(--card));background:var(--pt);border:1px solid color-mix(in srgb,var(--cb) 45%,var(--line));border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 18px 14px 22px;position:relative;overflow:hidden;min-width:0;max-width:100%}
.post+.post{margin-top:12px}
.post::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--cb)}
.post .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.post .hd .tag.course{background:var(--cb);color:#fff}
@media (prefers-color-scheme:dark){.post .hd .tag.course{color:#23211e}}
.post .new{background:var(--danger-ink);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 9px;line-height:20px}
.post .when{margin-left:auto;white-space:nowrap}
.post h4{font-size:16.5px;margin:8px 0 6px;line-height:1.45;overflow-wrap:anywhere;color:var(--dark)}
.post .body{font-size:14px;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere;word-break:break-word;max-width:100%;line-height:1.75;
  max-height:calc(1.75em*3);overflow:hidden;position:relative}
.post .body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.75em;background:linear-gradient(transparent,var(--pt))}
.post.open .body{max-height:none}
.post.open .body::after,.post.short .body::after{display:none}
.post .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.datechip{border:1px solid color-mix(in srgb,var(--cb) 60%,transparent);background:var(--card);color:var(--ci);border-radius:9px;padding:3px 10px;font-size:12.5px;font-weight:700}
.post .sp{flex:1}
.post.unread{box-shadow:0 0 0 2px color-mix(in srgb,var(--cb) 55%,transparent),var(--shadow)}
.post.star{--pt:color-mix(in srgb,var(--cb) 22%,var(--card))}
.starbtn{border:none;background:transparent;font-size:13px;font-weight:700;color:var(--ink-soft);padding:4px 6px;border-radius:7px}
.starbtn.on{color:#b8892e}
.news-sub{font-size:12.5px;color:var(--ink-faint);margin:-8px 0 12px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cal-head h2{font-size:19px;margin-right:auto}
.tt-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--cell)}
.tt-dh{background:var(--bg2);font-weight:700;color:var(--ink-soft);font-size:12px;text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line-strong)}
.tt-dh.we{color:var(--ink-faint)}

<body data-view="todo">

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const PREVIEW = false;           // 範例預覽版會改成 true
const DEFAULT_URL = "https://moodle.ncku.edu.tw";
const COLORS = ["#9FB39A","#8FA6C0","#AC9CC4","#CFB391","#CBA79F","#93B5AE","#C9BD9A","#C39AAE","#A7B7D6","#B9A58F"];
const EXTRA = ["#D9A6A0","#E0B57A","#A3C4A0","#7FA7B8","#B8A6D9","#9E9A93"];
const SWATCH = COLORS.concat(EXTRA);
const GRAY = "#B9B4AA";
const WK = "日一二三四五六";
const KIND = {assign:"作業",quiz:"測驗",forum:"討論區",lesson:"單元",workshop:"互評",choice:"票選",feedback:"回饋單",questionnaire:"問卷",
  attendance:"點名",scorm:"SCORM",lti:"外部工具",h5pactivity:"互動",data:"資料庫",glossary:"詞彙表",custom:"自己加的",ann:"公告提到",event:"課程行事曆",course:"課程"};

/* ---------- storage ---------- */
const LS = {
  get(k,d){try{const v=localStorage.getItem("mb:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("mb:"+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem("mb:"+k)}catch(e){}}
};
const S = {
  cfg: LS.get("cfg",{url:DEFAULT_URL,token:"",allForums:false,courses:null}),
  data: LS.get("data",null), custom: LS.get("custom",[]), hidden: new Set(LS.get("hidden",[])),
  seen: LS.get("seen",null), colors: LS.get("colors",{}), hinted: LS.get("hinted",false),
  cp: LS.get("cprefs",{}), edits: LS.get("edits",{}), starred: new Set(LS.get("starred",[])),
  tags: LS.get("tags",[{id:"t1",name:"重要",color:"#CBA79F"},{id:"t2",name:"要印",color:"#CFB391"},{id:"t3",name:"分組",color:"#8FA6C0"}]), det:null,
  filter: new Set(), open: new Set(), showDone:false, demo:false, loading:false, err:"",
  modal:null, cal:null, calSel:null, sub:null
};
const saveCfg=()=>LS.set("cfg",S.cfg);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>Math.floor(Date.now()/1000);
const pad=n=>String(n).padStart(2,"0");
const base=()=>S.cfg.url.replace(/\/+$/,"");
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return ""}}
function fmtDate(ts,{time=true,allDay=false}={}){const d=new Date(ts*1000);
  return `${d.getMonth()+1}/${d.getDate()}（${WK[d.getDay()]}）`+(time&&!allDay?`${pad(d.getHours())}:${pad(d.getMinutes())}`:"")}
function hm(ts){const d=new Date(ts*1000);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function dayKey(ts){const d=new Date(ts*1000);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function startOfDay(ts){const d=new Date(ts*1000);d.setHours(0,0,0,0);return Math.floor(d/1000)}
function dayDiff(ts){return Math.round((startOfDay(ts)-startOfDay(now()))/86400)}
function ago(ts){const s=now()-ts;
  if(s<60) return "剛剛"; if(s<3600) return `${Math.floor(s/60)} 分鐘前`; if(s<86400) return `${Math.floor(s/3600)} 小時前`;
  const d=-dayDiff(ts); if(d===1) return "昨天 "+hm(ts); if(d<7) return `${d} 天前`; return fmtDate(ts,{time:false})}
function remain(sec){const a=Math.abs(sec),d=Math.floor(a/86400),h=Math.floor(a%86400/3600),m=Math.floor(a%3600/60);
  const t=d>=7?`${d} 天`:d>=1?(h?`${d} 天 ${h} 時`:`${d} 天`):h>=1?`${h} 時 ${m} 分`:`${Math.max(m,1)} 分`;
  return sec<0?`逾期 ${t}`:`剩 ${t}`}
function when(x){ // 事件（非作業）用「今天／明天／N 天後」
  const d=dayDiff(x.due), t=x.allDay?"":" "+hm(x.due);
  return d===0?"今天"+t:d===1?"明天"+t:d===2?"後天"+t:d<0?`${-d} 天前`:`${d} 天後`}
function urgency(sec){return sec<0?"over":sec<86400?"hot":sec<3*86400?"warm":"calm"}
function shortName(n){
  let s=String(n||"").trim().replace(/^[\[【(（]?\s*\d{3}\s*[-－學年度]*\s*[12上下]?\s*[學期]*\s*[\]】)）]?\s*/,"").replace(/^[A-Z]\d{4,}[-\s]*/,"");
  if(/[一-鿿]/.test(s)) s=s.replace(/\s*[(（][^()（）]*[A-Za-z][^()（）]*[)）]\s*$/,"").replace(/\s+[A-Za-z][A-Za-z0-9 ,.&:'\-()]+$/,"");
  s=s.replace(/^[_\-－—\s]+/,"");
  return s||String(n||"")}
function htmlToText(h){
  if(!h) return "";
  const doc=new DOMParser().parseFromString(String(h),"text/html");
  doc.querySelectorAll("script,style").forEach(n=>n.remove());
  doc.querySelectorAll("br").forEach(n=>n.replaceWith("\n"));
  doc.querySelectorAll("p,div,li,tr,h1,h2,h3,h4,h5,h6,blockquote").forEach(n=>n.append("\n"));
  return (doc.body.textContent||"").replace(/ /g," ").replace(/[ \t]+/g," ").replace(/\n\s*\n+/g,"\n").trim()}
function textToHtml(t){return String(t).split(/\n/).map(l=>esc(l)).join("<br>")}
function fsize(b){return b>=1048576?(b/1048576).toFixed(b>=10485760?0:1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function colorOf(cid){
  if(!cid) return GRAY;
  if(S.cp[cid]&&S.cp[cid].color) return S.cp[cid].color;
  if(S.colors[cid]==null){const used=new Set(Object.values(S.colors));let i=0;while(used.has(i)&&i<COLORS.length)i++;
    S.colors[cid]=i<COLORS.length?i:Object.keys(S.colors).length%COLORS.length;LS.set("colors",S.colors)}
  return COLORS[S.colors[cid]]}
function course(cid){return (S.data&&S.data.courses||[]).find(c=>c.id===cid)}
function cname(cid){if(cid&&S.cp[cid]&&S.cp[cid].name) return S.cp[cid].name;const c=course(cid);return c?shortName(c.fullname):(cid?"":"個人")}
function cleanEv(n){const s=String(n||"").replace(/\s*(規定)?繳交截止通知\s*$/,"").replace(/\s*(規定繳交期限|is due|is due today|截止|到期)\s*$/i,"").trim();return s||String(n||"")}

/* ---------- 公告內文裡的日期 ---------- */
const RX_YMD=/(\d{3,4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})\s*[日號]?/g;
const RX_MD=/(\d{1,2})\s*(?:\/|／|月)\s*(\d{1,2})\s*[日號]?/g;
const RX_TIME=/^\s*(?:[（(]\s*(?:週|星期|禮拜)?\s*[一二三四五六日天]\s*[)）])?\s*(?:(?:週|星期|禮拜)[一二三四五六日天])?\s*(上午|早上|中午|下午|晚上|傍晚)?\s*(\d{1,2})\s*(?:[:：]\s*(\d{2})|點\s*(半|\d{1,2}\s*分?)?)/;
function snippetAround(t,idx){
  const stop=/[。！？!?\n；;，,]/; let a=idx,b=idx;
  while(a>0&&!stop.test(t[a-1])) a--; while(b<t.length&&!stop.test(t[b])) b++;
  if(b-a<8){let a2=a-1; while(a2>0&&!stop.test(t[a2-1])) a2--; if(a2>=0&&a-a2<30) a=a2}
  let s=t.slice(a,b).trim().replace(/^[，,、\s]+/,"");
  if(s.length>40){const rel=idx-a; const st=Math.max(0,Math.min(rel-12,s.length-40)); s=(st?"…":"")+s.slice(st,st+40)+"…"}
  return s}
function findDates(text,postTs){
  if(!text) return [];
  const t=text.replace(/https?:\/\/\S+/g,m=>" ".repeat(m.length)).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const out=new Map(), b0=new Date(postTs*1000);
  const take=(y,mo,d,idx,len)=>{
    const prev=t[idx-1]||"", next=t[idx+len]||"";
    if(/[\d\/.\-]/.test(prev)||/[\d\/]/.test(next)) return;
    if(y==null&&/[佔占約的為是乘除加減比]\s*$/.test(t.slice(Math.max(0,idx-2),idx))) return;
    if(y==null&&/^\s*[的以倍份成]/.test(t.slice(idx+len,idx+len+2))) return;
    if(mo<1||mo>12||d<1||d>31) return;
    let yy=y;
    if(yy==null){yy=b0.getFullYear();if(new Date(yy,mo-1,d)/1000<postTs-3*86400) yy+=1}
    else if(yy<1000) yy+=1911;
    const day=new Date(yy,mo-1,d); if(day.getMonth()!==mo-1) return;
    const tm=RX_TIME.exec(t.slice(idx+len,idx+len+24)); let allDay=true;
    if(tm){let h=+tm[2],mi=tm[3]!=null?+tm[3]:tm[4]==="半"?30:tm[4]?parseInt(tm[4]):0;
      if((tm[1]==="下午"||tm[1]==="晚上"||tm[1]==="傍晚")&&h<12) h+=12; if(tm[1]==="中午"&&h<11) h+=12;
      if(h<=23&&mi<=59){day.setHours(h,mi,0,0);allDay=false}}
    const ts=Math.floor(day/1000);
    if(ts<postTs-3*86400||ts>postTs+240*86400) return;
    const dk=dayKey(ts);
    for(const [k,v] of out){ if(dayKey(v.ts)===dk){ if(v.allDay&&!allDay) out.delete(k); else return; } }
    out.set(allDay?"d"+dk:"t"+ts,{ts,allDay,snip:snippetAround(t,idx)});
  };
  const spans=[];
  for(const m of t.matchAll(RX_YMD)){spans.push([m.index,m.index+m[0].length]);take(+m[1],+m[2],+m[3],m.index,m[0].length)}
  for(const m of t.matchAll(RX_MD)){if(spans.some(([a,b])=>m.index>=a&&m.index<b)) continue; take(null,+m[1],+m[2],m.index,m[0].length)}
  return [...out.values()].sort((a,b)=>a.ts-b.ts).slice(0,4)}

/* ---------- Moodle API ---------- */
class MErr extends Error{constructor(code,msg){super(msg);this.code=code}}
const AUTH=new Set(["invalidtoken","accessexception","usernotfullysetup","forcepasswordchangenotice","invalidlogin"]);
function flat(v,k,out){
  if(Array.isArray(v)) v.forEach((x,i)=>flat(x,`${k}[${i}]`,out));
  else if(v&&typeof v==="object") for(const [kk,x] of Object.entries(v)) flat(x,k?`${k}[${kk}]`:kk,out);
  else out.append(k,v===true?"1":v===false?"0":String(v))}
async function ws(fn,params={}){
  const body=new URLSearchParams({wstoken:S.cfg.token,wsfunction:fn,moodlewsrestformat:"json"}); flat(params,"",body);
  let r; try{r=await fetch(base()+"/webservice/rest/server.php",{method:"POST",body,credentials:"omit",cache:"no-store"})}
  catch(e){throw new MErr("network","連不上 Moodle")}
  if(!r.ok) throw new MErr("http","Moodle 回應錯誤（HTTP "+r.status+"）");
  let j; try{j=await r.json()}catch(e){throw new MErr("badjson","Moodle 回傳的不是資料")}
  if(j&&j.exception) throw new MErr(j.errorcode||"unknown",j.message||j.errorcode||"");
  return j}
async function uploadFile(file,itemid){
  const fd=new FormData(); fd.append("token",S.cfg.token); fd.append("filearea","draft"); fd.append("itemid",String(itemid||0)); fd.append("file_1",file,file.name);
  let r; try{r=await fetch(base()+"/webservice/upload.php",{method:"POST",body:fd,credentials:"omit"})}catch(e){throw new MErr("network","上傳時連不上 Moodle")}
  let j; try{j=await r.json()}catch(e){throw new MErr("badjson","上傳失敗")}
  if(!Array.isArray(j)||!j.length||j.error) throw new MErr(j&&j.errorcode||"upload",(j&&j.error)||"上傳失敗");
  return j[0].itemid}
async function pool(list,n,fn){const out=new Array(list.length);let i=0;
  await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{while(i<list.length){const k=i++;out[k]=await fn(list[k])}}));return out}
function pickCurrent(courses,t){const act=courses.filter(c=>c.visible!==0&&(!c.enddate||c.enddate>t)&&!c.hidden);
  const recent=act.filter(c=>(c.startdate||0)>=t-210*86400);return recent.length?recent:act}
let discussionFn=null;
async function discussions(fid){
  const v=[["mod_forum_get_forum_discussions",{forumid:fid,page:0,perpage:15}],
    ["mod_forum_get_forum_discussions_paginated",{forumid:fid,sortby:"timemodified",sortdirection:"DESC",page:0,perpage:15}]];
  if(discussionFn) v.sort(a=>a[0]===discussionFn?-1:1);
  let last; for(const [fn,p] of v){try{const r=await ws(fn,p);discussionFn=fn;return r.discussions||[]}

async function fetchAll(){

  const diag={};

      const cid=e.courseid||(e.course&&e.course.id)||0;

      courseId:ids.includes(cid)?cid:0,note:htmlToText(e.description).slice(0,200),url:`${b}/calendar/view.php?view=day&time=${e.timestart}`}});
  const calP=ws("core_calendar_get_calendar_events",{events:{courseids:ids},options:{userevents:1,siteevents:0,timestart:t-45*86400,timeend:t+150*86400}}).then(mapCal)
    .catch(async e=>{ if(AUTH.has(e.code)&&e.code!=="accessexception") throw e;
      diag.cal=(e.code||"")+" "+e.message;
      try{return mapCal(await ws("core_calendar_get_calendar_upcoming_view",{}))}catch(e2){diag.cal2=(e2.code||"")+" "+e2.message;return null}});
  const postP=(async()=>{
    const forums=await ws("mod_forum_get_forums_by_courses",{courseids:ids});
    const use=forums.filter(f=>ids.includes(f.course)&&(S.cfg.allForums||f.type==="news"));
    const lists=await pool(use,4,async f=>{try{

        return {id:"d"+did,courseId:f.course,forum:htmlToText(f.name),news:f.type==="news",title:htmlToText(d.subject||d.name)||"（無標題）",
          text:htmlToText(d.message).slice(0,5000),author:d.userfullname||"",time:d.created||d.timemodified||0,pinned:!!d.pinned,
          att:(d.attachments&&d.attachments.length)||(d.attachment?1:0),url:`${b}/mod/forum/discuss.php?d=${did}`}})}
      catch(e){if(AUTH.has(e.code)) throw e; warns.push("部分討論區"); return []}});
    return lists.flat().sort((a,b)=>b.time-a.time).slice(0,200);
  })().catch(soft("公告"));
  const [events,cal,posts]=await Promise.all([evP,calP,postP]); const prev=S.data||{};
  return {fetched:t,user:info.fullname||"",site:info.sitename||"",
    courses:courses.map(c=>({id:c.id,fullname:htmlToText(c.fullname||c.shortname)||String(c.id),startdate:c.startdate||0})),selected:ids,
    events:events||prev.events||[],cal:cal||prev.cal||[],posts:posts||prev.posts||[],diag,
    warn:warns.length?[...new Set(warns)].join("、")+"這次沒讀到，顯示的是上次的資料":""}}

function visible(cid){return !S.filter.size||!cid||S.filter.has(cid)}
function allItems(){
  const d=S.data||{events:[],cal:[],posts:[]}, out=[];
  for(const e of d.events) out.push(Object.assign({},e,{src:"m",task:true,done:S.hidden.has(e.id)}));
  for(const c of S.custom) out.push({id:c.id,name:c.title,kind:"custom",due:c.due,allDay:c.allDay,courseId:c.courseId||0,url:c.url||"",note:c.note||"",src:"c",task:true,done:!!c.done});
  for(const k of d.cal||[]) out.push(Object.assign({},k,{src:"k",task:false,done:S.hidden.has(k.id)}));
  for(const p of d.posts||[]) for(const x of findDates(p.text,p.time)){
    const id="p"+p.id.slice(1)+"@"+x.ts;
    out.push({id,name:p.title,kind:"ann",due:x.allDay?startOfDay(x.ts)+86340:x.ts,allDay:x.allDay,courseId:p.courseId,url:p.url,
      note:x.snip,src:"p",task:false,done:S.hidden.has(id),postId:p.id});
  }
  for(const x of out){
    x.orig={name:x.name,due:x.due,allDay:x.allDay};
    const ed=S.edits[x.id]; if(!ed) continue;
    if(ed.name) x.name=ed.name;
    if(ed.due){x.due=ed.due;x.allDay=!!ed.allDay;x.moved=true}
    if(ed.memo) x.memo=ed.memo;
    if(ed.tags) x.tags=ed.tags.filter(t=>S.tags.some(g=>g.id===t));
    if(x.src==="c"&&ed.courseId!=null) x.courseId=ed.courseId;
  }
  return out.filter(x=>visible(x.courseId)).sort((a,b)=>a.due-b.due)}
function todoLists(){
  const t=now(),sod=startOfDay(t),all=allItems();
  const open=[],done=[];
  for(const x of all){
    if(!x.task&&(x.due<sod||x.due>t+60*86400)) continue;     // 過去的活動不算待辦
    (x.done?done:open).push(x)}
  return {open,done,all}}

function calHTML(all,t){
  if(!S.cal){const d=new Date();S.cal={y:d.getFullYear(),m:d.getMonth()}}
  if(!S.calSel) S.calSel=dayKey(t);
  const {y,m}=S.cal, first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  const weeks=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7);
  const by=new Map(); for(const x of all){const k=dayKey(x.due);if(!by.has(k))by.set(k,[]);by.get(k).push(x)}
  let cells="";
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=dayKey(d/1000), list=(by.get(k)||[]);
    const cls=["tt-cell",d.getMonth()!==m?"out":"",k===dayKey(t)?"today":"",k===S.calSel?"sel":""].join(" ");
    cells+=`<button class="${cls}" data-act="pickday" data-k="${k}" aria-label="${d.getMonth()+1} 月 ${d.getDate()} 日，${list.length} 件事">
      <span class="dn">${d.getDate()}</span>
      ${list.slice(0,3).map(x=>`<span class="tt-block cc${x.task?"":" evt"}${x.done?" done":""}" style="${cbStyle(x.courseId)}">${esc(x.allDay||!x.task&&x.src==="p"&&x.allDay?"":hm(x.due)+" ")}${esc(x.name)}</span>`).join("")}
      ${list.length>3?`<span class="tt-more">還有 ${list.length-3} 件</span>`:""}
      ${list.length?`<span class="dots">${list.slice(0,4).map(x=>`<i class="cc" style="${cbStyle(x.courseId)}"></i>`).join("")}</span>`:""}
    </button>`}
  const sel=by.get(S.calSel)||[], sy=Math.floor(S.calSel/10000), sm=Math.floor(S.calSel/100)%100, sd=S.calSel%100, sdate=new Date(sy,sm-1,sd);
  const ids=S.data.selected||[];
  return `<div class="panel">
    <div class="cal-head"><h2>${y} 年 ${m+1} 月</h2>
      <button class="btn ghost small" data-act="mon" data-d="-1" aria-label="上個月">‹</button>
      <button class="btn ghost small" data-act="mon" data-d="0">今天</button>
      <button class="btn ghost small" data-act="mon" data-d="1" aria-label="下個月">›</button></div>
    <div class="tt-grid">${[...WK].map((w,i)=>`<div class="tt-dh${i===0||i===6?" we":""}">${w}</div>`).join("")}${cells}</div>
    <div class="cat-legend">${ids.map(id=>`<span class="cc" style="${cbStyle(id)}"><i></i>${esc(cname(id))}</span>`).join("")}
      <span class="cc" style="--cb:${GRAY}"><i class="d"></i>虛線是活動（公告提到、課程行事曆）</span></div>
  </div>
  <div class="day-panel"><div class="group-label">${sdate.getMonth()+1}/${sdate.getDate()}（${WK[sdate.getDay()]}）<span class="n">${sel.length} 件</span></div>
    ${sel.length?`<div class="plist">${sel.map(x=>itemHTML(x,t)).join("")}</div>`:`<div class="empty">這天沒有安排。</div>`}</div>`}

/* ---------- 繳交作業 ---------- */
const ST={new:"還沒交",draft:"草稿（還沒送出）",submitted:"已繳交",reopened:"老師開放重交"};
async function openSubmit(id){
  const x=allItems().find(i=>i.id===id)||(S.data.events||[]).find(i=>i.id===id); if(!x) return;
  S.sub={x,loading:true,files:[],text:"",origText:"",origHtml:"",stmt:false,busy:false,err:"",doneMsg:""}; S.modal="submit"; renderLayer();
  try{
    if(S.demo){await new Promise(r=>setTimeout(r,300));
      Object.assign(S.sub,{a:{intro:"請上傳 .zip，內含程式碼與 README。檔名格式：學號_HW2.zip",drafts:true,stmtReq:true,stmtText:"這份作業是我自己完成的，除了已標明引用的部分。",
        fileOn:true,textOn:false,maxFiles:1,maxBytes:20*1048576,types:".zip"},st:{status:"new",canedit:true,cansubmit:true,files:[],locked:false}})}
    else{
      const [ar,sr]=await Promise.all([ws("mod_assign_get_assignments",{courseids:[x.courseId]}),ws("mod_assign_get_submission_status",{assignid:x.inst})]);
      const a=(ar.courses||[]).flatMap(c=>c.assignments||[]).find(a=>a.id===x.inst)||{};
      const cfg=(p,n)=>{const c=(a.configs||[]).find(c=>c.plugin===p&&c.name===n&&(c.subtype==="assignsubmission"||!c.subtype));return c?c.value:null};
      const la=sr.lastattempt||{}, sub=la.submission||(la.teamsubmission)||{}, plugins=sub.plugins||[];
      const files=plugins.filter(p=>p.type==="file").flatMap(p=>(p.fileareas||[]).flatMap(f=>f.files||[])).map(f=>({name:f.filename,size:f.filesize}));
      const ed=plugins.filter(p=>p.type==="onlinetext").flatMap(p=>p.editorfields||[])[0];
      const types=(cfg("file","filetypeslist")||"").split(/[,;\s]+/).filter(s=>/^\.[a-z0-9]+$/i.test(s)).join(",");
      S.sub.a={intro:htmlToText(a.intro),drafts:!!+a.submissiondrafts,stmtReq:!!+a.requiresubmissionstatement,stmtText:htmlToText(a.submissionstatement)||"這份作業是我自己完成的，除了已標明引用的部分。",
        fileOn:cfg("file","enabled")==="1",textOn:cfg("onlinetext","enabled")==="1",maxFiles:+cfg("file","maxfilesubmissions")||0,
        maxBytes:+cfg("file","maxsubmissionsizebytes")||+a.maxattachments||0,types};
      S.sub.st={status:sub.status||"new",canedit:!!la.canedit,cansubmit:!!la.cansubmit,files,locked:!!la.locked,graded:la.gradingstatus==="graded"};
      if(ed){S.sub.origHtml=ed.text||"";S.sub.origText=S.sub.text=htmlToText(ed.text)}
    }
  }catch(e){S.sub.err=AUTH.has(e.code)?"金鑰失效了，請重新連線。":"讀不到這份作業的資料："+e.message}
  S.sub.loading=false; if(S.modal==="submit") renderLayer()}
function submitHTML(){
  const s=S.sub, x=s.x, url=safeUrl(x.url);
  const head=`<div class="cc" style="${cbStyle(x.courseId)}"><span class="tag course">${esc(cname(x.courseId))}</span></div>
    <h3 style="margin-top:8px">${esc(x.name)}</h3><p class="hint" style="margin-bottom:0">${esc(fmtDate(x.due))} 截止，${esc(remain(x.due-now()))}</p>`;
  if(s.loading) return head+`<p class="hint" style="margin-top:16px">讀取作業資料中…</p>`;
  if(s.doneMsg) return head+`<div class="okbox" style="margin-top:16px">${esc(s.doneMsg)}</div><div class="row"><button class="btn" data-act="close">好</button></div>`;
  const moodle=url?`<a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener">在 Moodle 開啟</a>`:"";
  if(s.err&&!s.a) return head+`<div class="warnbox">${esc(s.err)}</div><div class="row">${moodle}<button class="btn ghost" data-act="close">關閉</button></div>`;
  const a=s.a, st=s.st;
  const status=`<div class="status"><span class="tag">${esc(ST[st.status]||st.status)}</span>${st.graded?`<span class="tag">已評分</span>`:""}${a.drafts?`<span class="tag">要按「送出」才算交</span>`:""}</div>`;
  const intro=a.intro?`<div class="intro">${esc(a.intro)}</div>`:"";
  if(!st.canedit&&!(a.drafts&&st.cansubmit&&st.status==="draft")) return head+status+intro+
    `<div class="warnbox">${st.status==="submitted"?"你已經交了，這份作業目前不能再修改。":"這份作業目前不能在這裡繳交（可能已截止或被鎖定）。"}</div><div class="row">${moodle}<button class="btn ghost" data-act="close">關閉</button></div>`;
  let body="";
  if(a.fileOn){
    const lim=[a.maxFiles?`最多 ${a.maxFiles} 個檔案`:"",a.maxBytes?`每個 ${fsize(a.maxBytes)} 以內`:"",a.types?`格式 ${a.types}`:""].filter(Boolean).join("，");
    body+=`<div class="fgroup"><label class="field">檔案${lim?`<span style="font-weight:500;color:var(--ink-faint)">　${esc(lim)}</span>`:""}</label>
      ${st.files.length?`<div class="files">${st.files.map(f=>`<div class="file"><span>${esc(f.name)}</span><small>目前在 Moodle 上・${esc(fsize(f.size))}</small></div>`).join("")}</div>`:""}
      <label class="drop" id="drop" style="margin-top:8px">${s.files.length?"再加檔案":"點這裡選檔案，或把檔案拖進來"}<input type="file" id="fpick" ${a.maxFiles!==1?"multiple":""} ${a.types?`accept="${esc(a.types)}"`:""}></label>
      ${s.files.length?`<div class="files">${s.files.map((f,i)=>`<div class="file"><span>${esc(f.name)}</span><small>${esc(fsize(f.size))}</small><button class="linkbtn" data-act="rmfile" data-i="${i}" aria-label="移除 ${esc(f.name)}">移除</button></div>`).join("")}</div>`:""}
      ${s.files.length&&st.files.length?`<div class="warnbox">新選的檔案會取代 Moodle 上原本的 ${st.files.length} 個檔案。</div>`:""}
    </div>`}
  if(a.textOn) body+=`<div class="fgroup"><label class="field" for="otext">線上文字</label><textarea class="input" id="otext" placeholder="直接在這裡打">${esc(s.text)}</textarea></div>`;
  if(!a.fileOn&&!a.textOn) body+=`<div class="warnbox">這份作業不用在線上繳交東西，或是用了這裡不支援的方式。</div>`;
  const willFinal=a.drafts;
  if(willFinal&&a.stmtReq) body+=`<label class="stmt"><input type="checkbox" class="chk" id="stmt" ${s.stmt?"checked":""}><span>${esc(a.stmtText)}</span></label>`;
  const hasNew=s.files.length||(a.textOn&&s.text.trim()!==s.origText.trim());
  const hasAny=hasNew||st.files.length||(a.textOn&&s.origText.trim());
  const ok=(a.fileOn||a.textOn)&&hasAny&&(!willFinal||!a.stmtReq||s.stmt)&&!s.busy;
  return head+status+intro+body+(s.err?`<div class="warnbox">${esc(s.err)}</div>`:"")+
    `<p class="hint" style="margin:12px 0 0">${s.x.due<now()?"已經過了截止時間，Moodle 可能會標成遲交。":""}${willFinal?"按「送出」後老師就會看到，之後不能再修改。":s.x.due<now()?"":"繳交後，截止前都還可以回來重交。"}</p>
    <div class="row">${moodle}${willFinal&&hasNew?`<button class="btn ghost" data-act="dosubmit" data-final="0" ${s.busy||!hasNew?"disabled":""}>只存草稿</button>`:""}
      <button class="btn" data-act="dosubmit" data-final="1" ${ok?"":"disabled"}>${s.busy?"處理中…":willFinal?"送出":"繳交"}</button></div>`}
async function doSubmit(final){
  const s=S.sub,a=s.a,st=s.st; if(s.busy) return;
  const t=$("#otext"); if(t) s.text=t.value;
  // 檢查
  if(a.maxFiles&&s.files.length>a.maxFiles){s.err=`最多只能交 ${a.maxFiles} 個檔案。`;return renderLayer()}
  const big=s.files.find(f=>a.maxBytes&&f.size>a.maxBytes); if(big){s.err=`「${big.name}」超過 ${fsize(a.maxBytes)}。`;return renderLayer()}
  const textChanged=a.textOn&&s.text.trim()!==s.origText.trim();
  if(a.fileOn&&!s.files.length&&st.files.length&&textChanged){s.err="這裡沒辦法只改文字又保留 Moodle 上原本的檔案，請重新選擇要交的檔案，或到 Moodle 網頁上修改。";return renderLayer()}
  s.busy=true; s.err=""; renderLayer();
  try{
    if(S.demo){await new Promise(r=>setTimeout(r,700))}
    else{
      const pd={};
      if(s.files.length||textChanged){
        if(a.fileOn){let item=0; for(const f of s.files) item=await uploadFile(f,item); if(s.files.length||!st.files.length) pd.files_filemanager=item}
        if(a.textOn) pd.onlinetext_editor={text:textChanged?textToHtml(s.text):s.origHtml,format:1,itemid:0};
        const w=await ws("mod_assign_save_submission",{assignmentid:s.x.inst,plugindata:pd});
        if(Array.isArray(w)&&w.length) throw new MErr("warn",w.map(x=>x.message||x.item).join("；"));
      }
      if(final&&a.drafts){
        const w=await ws("mod_assign_submit_for_grading",{assignmentid:s.x.inst,acceptsubmissionstatement:s.stmt?1:0});
        if(Array.isArray(w)&&w.length) throw new MErr("warn",w.map(x=>x.message||x.item).join("；"));
      }
    }
    s.busy=false;
    s.doneMsg=S.demo?"範例模式：不會真的繳交。正式版這時就已經交到 Moodle 了。":final||!a.drafts?"已交到 Moodle 了！可以按「在 Moodle 開啟」確認。":"已存成草稿，記得之後要回來按「送出」。";
    renderLayer(); if(!S.demo) refresh({quiet:true});
  }catch(e){s.busy=false;s.err=(AUTH.has(e.code)?"金鑰失效了，請重新連線。":"沒有交成功："+e.message);renderLayer()}}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg,undo){const el=$("#toast");clearTimeout(toastTimer);
  el.innerHTML=esc(msg)+(undo?`<button type="button">復原</button>`:""); if(undo) el.querySelector("button").onclick=()=>{undo();el.classList.remove("show")};
  el.classList.add("show"); toastTimer=setTimeout(()=>el.classList.remove("show"),undo?6000:3200)}

/* ---------- 更新資料 ---------- */
async function refresh({quiet=false}={}){
  if(S.demo){S.data=demoData();render();return}
  if(S.loading||!S.cfg.token) return;
  S.loading=true; if(!quiet) render();
  try{
    const d=await fetchAll(); S.data=d; S.err="";
    if(S.seen==null) S.seen=d.posts.map(p=>p.id);
    else {const cur=new Set(d.posts.map(p=>p.id));S.seen=S.seen.filter(id=>cur.has(id)).concat(S.seen.filter(id=>!cur.has(id)).slice(-300))}
    LS.set("seen",S.seen);
    const ids=new Set(allItems().map(x=>x.id)); S.hidden=new Set([...S.hidden].filter(id=>ids.has(id)||!/^[ekp]/.test(id))); LS.set("hidden",[...S.hidden]);
    LS.set("data",d);
  }catch(e){
    if(AUTH.has(e.code)){S.err=S.data?"Moodle 不接受這把金鑰了（可能過期）。請到設定裡登出，再貼一次新的金鑰。":"這把金鑰不對，或已經過期。請再複製一次。"}
    else S.err=S.data?`${e.message}，畫面上是 ${ago(S.data.fetched)} 的資料。`:`${e.message}。請確認網路，或稍後再試。`;
  }finally{S.loading=false;render()}}

/* ---------- 事件 ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="close"){if(e.target!==el) return; if(S.sub&&S.sub.busy) return; S.modal=null;S.sub=null;S.cpDraft=null;return renderLayer()}
  if(a==="refresh") return refresh();
  if(a==="settings"){S.modal="settings";S.cpDraft=null;return renderLayer()}
  if(a==="add"){S.modal="add";return renderLayer()}
  if(a==="view"){document.body.dataset.view=el.dataset.v;window.scrollTo({top:0});return render()}
  if(a==="filter"){if(el.dataset.id==="all") S.filter.clear(); else {const id=+el.dataset.id;S.filter.has(id)?S.filter.delete(id):S.filter.add(id)} return render()}
  if(a==="showdone"){S.showDone=!S.showDone;return render()}
  if(a==="expand"){const id=el.dataset.id;S.open.has(id)?S.open.delete(id):S.open.add(id);markRead(id);return render()}
  if(a==="markread"){markRead(el.dataset.id);setTimeout(render,50);return}
  if(a==="readall"){S.seen=[...new Set([...(S.seen||[]),...S.data.posts.map(p=>p.id)])];LS.set("seen",S.seen);return render()}
  if(a==="gocal"){const d=new Date(+el.dataset.ts*1000);S.cal={y:d.getFullYear(),m:d.getMonth()};S.calSel=dayKey(+el.dataset.ts);document.body.dataset.view="cal";window.scrollTo({top:0});return render()}
  if(a==="pickday"){S.calSel=+el.dataset.k;return render()}
  if(a==="mon"){const dd=+el.dataset.d; if(!dd){const n=new Date();S.cal={y:n.getFullYear(),m:n.getMonth()};S.calSel=dayKey(now())} else {const n=new Date(S.cal.y,S.cal.m+dd,1);S.cal={y:n.getFullYear(),m:n.getMonth()}} return render()}
  if(a==="delcustom"){S.custom=S.custom.filter(x=>x.id!==el.dataset.id);LS.set("custom",S.custom);delete S.edits[el.dataset.id];LS.set("edits",S.edits);S.modal=null;return render()}
  if(a==="detail"){S.det=el.dataset.id;S.modal="detail";S.tagSel=null;return renderLayer()}
  if(a==="picktag"){el.setAttribute("aria-pressed",el.getAttribute("aria-pressed")==="true"?"false":"true");return}
  if(a==="resetedit"){delete S.edits[el.dataset.id];LS.set("edits",S.edits);S.modal=null;render();return toast("已還原")}
  if(a==="hideitem"){S.hidden.add(el.dataset.id);LS.set("hidden",[...S.hidden]);S.modal=null;render();const id=el.dataset.id;return toast("好，這件不再顯示",()=>{S.hidden.delete(id);LS.set("hidden",[...S.hidden]);render()})}
  if(a==="star"){const id=el.dataset.id;S.starred.has(id)?S.starred.delete(id):S.starred.add(id);LS.set("starred",[...S.starred]);markRead(id);return render()}
  if(a==="pickcolor"){el.closest(".sws").querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",b===el?"true":"false"));return}
  if(a==="addtag"){const inp=$("#newtag"),n=inp.value.trim();if(!n) return;const used=new Set(S.tags.map(g=>g.color));
    const col=SWATCH.find(c=>!used.has(c))||SWATCH[S.tags.length%SWATCH.length];S.tags.push({id:"t"+Date.now(),name:n,color:col});LS.set("tags",S.tags);keepSettings();return renderLayer()}
  if(a==="deltag"){S.tags=S.tags.filter(g=>g.id!==el.dataset.id);LS.set("tags",S.tags);keepSettings();return renderLayer()}
  if(a==="submit") return openSubmit(el.dataset.id);
  if(a==="rmfile"){S.sub.files.splice(+el.dataset.i,1);return renderLayer()}
  if(a==="dosubmit") return doSubmit(el.dataset.final==="1");
  if(a==="demo"){S.demo=true;S.err="";S.data=demoData();return render()}
  if(a==="logout"){if(S.demo){S.demo=false;S.data=null;S.modal=null;return render()}
    ["cfg","data","custom","hidden","seen","colors","hinted","cprefs","edits","starred","tags"].forEach(LS.del); location.reload()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.act==="toggle"){
    const id=el.dataset.id, src=el.dataset.src;
    if(src==="c"){const c=S.custom.find(x=>x.id===id);if(c){c.done=el.checked;LS.set("custom",S.custom)} return render()}
    el.checked?S.hidden.add(id):S.hidden.delete(id); LS.set("hidden",[...S.hidden]); render();
    if(el.checked){toast(src==="m"&&!S.hinted?"已標為完成。這只記在這裡，Moodle 上還是要真的交。":src==="m"?"已標為完成":"好，這件不再顯示",()=>{S.hidden.delete(id);LS.set("hidden",[...S.hidden]);render()});
      if(src==="m"&&!S.hinted){S.hinted=true;LS.set("hinted",true)}}
    return}
  if(el.id==="fpick"){S.sub.files.push(...el.files);S.sub.err="";if(S.sub.a.maxFiles===1)S.sub.files=S.sub.files.slice(-1);return renderLayer()}
  if(el.id==="stmt"){S.sub.stmt=el.checked;const t=$("#otext");if(t)S.sub.text=t.value;return renderLayer()}
});
document.addEventListener("input",e=>{if(e.target.id==="otext"&&S.sub){S.sub.text=e.target.value;const b=document.querySelector('[data-act="dosubmit"][data-final="1"]');
  if(b&&!S.sub.busy){const a=S.sub.a,has=S.sub.files.length||S.sub.text.trim()||S.sub.st.files.length;b.disabled=!(has&&(!a.drafts||!a.stmtReq||S.sub.stmt))}}});
["dragover","dragleave","drop"].forEach(tp=>document.addEventListener(tp,e=>{
  const d=e.target.closest&&e.target.closest("#drop"); if(!d) return; e.preventDefault();
  if(tp==="dragover") d.classList.add("over"); else d.classList.remove("over");
  if(tp==="drop"&&e.dataTransfer.files.length){S.sub.files.push(...e.dataTransfer.files);if(S.sub.a.maxFiles===1)S.sub.files=S.sub.files.slice(-1);renderLayer()}}));
function markRead(id){if(S.seen&&!S.seen.includes(id)){S.seen.push(id);LS.set("seen",S.seen)}}
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="setup-form"){
    const tok=$("#tok").value.trim(),u=$("#murl")?$("#murl").value.trim():S.cfg.url; if(!tok) return;
    S.cfg.token=tok; S.cfg.url=safeUrl(u)?u.replace(/\/+$/,""):DEFAULT_URL; S.cfg.courses=null; S.err=""; saveCfg();
    await refresh(); if(!S.data){S.cfg.token="";saveCfg();render()}}
  if(f.id==="add-form"){
    const title=$("#a-t").value.trim(),v=$("#a-d").value,cid=+$("#a-c").value,due=Math.floor(new Date(v)/1000); if(!title||!due) return;
    S.custom.push({id:"c"+Date.now(),title,due,allDay:false,courseId:cid,done:false}); LS.set("custom",S.custom); S.modal=null; render(); toast("已新增待辦")}
  if(f.id==="set-form"){
    f.querySelectorAll(".crow").forEach(r=>{const inp=r.querySelector("input[name^=nm-]");const cid=+inp.name.slice(3);const on=r.querySelector('.sw[aria-pressed="true"]');
      const name=inp.value.trim(), color=on?on.dataset.c:null; const def=COLORS[S.colors[cid]];
      S.cp[cid]={}; if(name) S.cp[cid].name=name; if(color&&color!==def) S.cp[cid].color=color; if(!Object.keys(S.cp[cid]).length) delete S.cp[cid]});
    LS.set("cprefs",S.cp); S.cpDraft=null;
    if(S.demo){S.modal=null;render();toast("已儲存");return}
    const ids=[...f.querySelectorAll('input[name="c"]:checked')].map(i=>+i.value); if(!ids.length){toast("至少要選一門課");return}
    const changed=ids.join()!==(S.data.selected||[]).join()||S.cfg.allForums!==$("#s-all").checked;
    S.cfg.courses=ids; S.cfg.allForums=$("#s-all").checked; saveCfg(); S.filter.clear(); S.modal=null; render(); toast("已儲存"); if(changed) await refresh()}
  if(f.id==="edit-form"){
    const id=f.dataset.id, x=allItems().find(i=>i.id===id); if(!x) return;
    const name=$("#e-n").value.trim(), v=$("#e-d").value, ad=$("#e-ad").checked, memo=$("#e-m").value.trim();
    const tags=[...f.querySelectorAll('.tagpick [aria-pressed="true"]')].map(b=>b.dataset.id);
    let due=v?Math.floor(new Date(v)/1000):x.due; if(ad) due=startOfDay(due)+86340;
    const ed={};
    if(name&&name!==x.orig.name) ed.name=name;
    if(Math.abs(due-x.orig.due)>59||ad!==!!x.orig.allDay){ed.due=due;ed.allDay=ad}
    if(memo) ed.memo=memo; if(tags.length) ed.tags=tags;
    if(x.src==="c"){const c=S.custom.find(c=>c.id===id); if(c){if(name)c.title=name;c.due=due;c.allDay=ad;c.courseId=+$("#e-c").value;LS.set("custom",S.custom)}
      delete ed.name;delete ed.due;delete ed.allDay}
    if(Object.keys(ed).length) S.edits[id]=ed; else delete S.edits[id];
    LS.set("edits",S.edits); S.modal=null; render(); toast("已儲存")}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.modal&&!(S.sub&&S.sub.busy)){S.modal=null;S.sub=null;renderLayer()}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".pmeta[data-act=detail]")){e.preventDefault();e.target.click()}});
function keepSettings(){ // 設定視窗重畫前，先記住還沒儲存的顏色和名字
  document.querySelectorAll("#set-form .crow").forEach(r=>{const inp=r.querySelector("input[name^=nm-]");const cid=+inp.name.slice(3);
    const on=r.querySelector('.sw[aria-pressed="true"]');S.cpDraft=S.cpDraft||{};S.cpDraft[cid]={name:inp.value.trim(),color:on?on.dataset.c:null}})}

/* 倒數 */
let tick=0;
setInterval(()=>{
  const t=now(),clk=$(".next .clock");
  if(clk){const sec=+clk.dataset.due-t; if(sec<=0) return render(); clk.innerHTML=clockHTML(sec)}
  if(++tick%30===0) document.querySelectorAll(".rem[data-due]").forEach(p=>{const s=+p.dataset.due-t;p.textContent=remain(s);p.className="rem "+urgency(s)});
},1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.data&&!S.demo&&now()-S.data.fetched>300) refresh({quiet:true})});

/* 啟動 */
if(PREVIEW){S.demo=true;S.data=demoData()}
else if(S.cfg.token&&S.data){render();refresh({quiet:true})}
else if(S.cfg.token){S.data=null;refresh()}
else S.data=null;
render();
</script>
</body>
